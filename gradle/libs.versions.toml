kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

petchat-android-application = { id = "petchat.android.application" }
petchat-android-compose = { id = "petchat.android.compose" }
petchat-android-feature = { id = "petchat.android.feature" }
petchat-android-hilt = { id = "petchat.android.hilt" }
petchat-android-library = { id = "petchat.android.library" }
petchat-jvm-library = { id = "petchat.jvm.library" }
